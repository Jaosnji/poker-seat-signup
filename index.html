<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>德州桌位报名程序</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 16px 60px;
    color: #e0e0e0;
  }
  h1 { font-size: 1.6em; margin-bottom: 4px; color: #fff; }
  .subtitle { color: #666; margin-bottom: 24px; font-size: 0.9em; }

  /* === 椭圆桌（居中靠上） === */
  .table-svg {
    display: block;
    margin-bottom: 24px;
  }

  /* === 9个座位：位置标签在上，填名字在下 === */
  .seats-wrap {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    max-width: 420px;
  }
  .seat-card {
    width: 112px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .seat-card .pos-badge {
    width: 42px;
    height: 42px;
    background: #e94560;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    border: 2px solid rgba(255,255,255,0.2);
    box-shadow: 0 2px 10px rgba(233,69,96,0.4);
    cursor: default;
  }
  .seat-card .pos-label {
    font-size: 10px;
    color: #555;
  }
  .seat-card input {
    width: 100%;
    padding: 9px 8px;
    border: 2px solid #3a3a5c;
    border-radius: 10px;
    background: #16213e;
    color: #fff;
    font-size: 12px;
    text-align: center;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .seat-card input::placeholder { color: #444; font-size: 10px; }
  .seat-card input.filled {
    border-color: #4ade80;
    background: #0f2e1a;
    color: #4ade80;
    font-weight: 600;
    box-shadow: 0 0 10px rgba(74,222,128,0.2);
  }
  .seat-card input:focus {
    border-color: #e94560;
    box-shadow: 0 0 14px rgba(233,69,96,0.35);
  }

  .btns {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    padding: 11px 28px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary { background: #e94560; color: #fff; }
  .btn-primary:hover { background: #ff6b81; transform: translateY(-2px); }
  .btn-secondary { background: #3a3a5c; color: #e0e0e0; }
  .btn-secondary:hover { background: #4a4a70; transform: translateY(-2px); }
  .btn-admin { background: #f59e0b; color: #1a1a2e; }
  .btn-admin:hover { background: #fbbf24; transform: translateY(-2px); }
  .btn:active { transform: scale(0.97); }

  .status {
    margin-top: 16px;
    font-size: 13px;
    color: #555;
    min-height: 18px;
    text-align: center;
    max-width: 400px;
  }
  .status.ok { color: #4ade80; }
  .status.warn { color: #facc15; }
  .status.error { color: #ef4444; }

  .info {
    margin-top: 20px;
    font-size: 11px;
    color: #444;
    text-align: center;
    line-height: 2;
  }
  .info strong { color: #666; }

  .admin-panel {
    margin-top: 20px;
    padding: 16px;
    border: 1px solid #3a3a5c;
    border-radius: 12px;
    background: #16213e;
    display: none;
    max-width: 400px;
    width: 100%;
  }
  .admin-panel.show { display: block; }
  .admin-panel h3 { font-size: 13px; color: #f59e0b; margin-bottom: 12px; }
  .admin-panel input {
    width: 100%;
    padding: 10px;
    border: 2px solid #3a3a5c;
    border-radius: 8px;
    background: #1a1a2e;
    color: #fff;
    font-size: 13px;
    margin-bottom: 10px;
  }
  .admin-panel .btn { width: 100%; margin-top: 4px; }

  .loading { opacity: 0.5; pointer-events: none; }
</style>
</head>
<body>

<h1>🃏 德州桌位报名程序</h1>
<p class="subtitle">填写下方名字预约对应座位</p>

<!-- 椭圆牌桌图形 -->
<svg class="table-svg" width="360" height="220" viewBox="0 0 360 220">
  <!-- 外发光 -->
  <ellipse cx="180" cy="110" rx="150" ry="95" fill="#2d6b3f" stroke="#5c3a1e" stroke-width="14"/>
  <!-- 木纹高光 -->
  <ellipse cx="180" cy="110" rx="150" ry="95" fill="none" stroke="#8b5e3c" stroke-width="2" opacity="0.5"/>
  <!-- 内阴影 -->
  <ellipse cx="180" cy="110" rx="136" ry="81" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>
  <!-- 桌面文字 -->
  <text x="180" y="116" text-anchor="middle" fill="rgba(255,255,255,0.12)"
    font-size="14" font-weight="900" font-family="Georgia, serif"
    letter-spacing="4">TEXAS HOLD'EM</text>
  <!-- 庄家位标记 -->
  <circle cx="180" cy="20" r="14" fill="#e94560" stroke="#fff" stroke-width="2"/>
  <text x="180" y="24" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">D</text>
  <!-- 位置1：顶部居中 -->
  <circle cx="180" cy="20" r="9" fill="rgba(255,255,255,0.15)" stroke="#aaa" stroke-width="1"/>
  <text x="180" y="24" text-anchor="middle" fill="#aaa" font-size="9" font-weight="600">1</text>
  <!-- 位置2：右上 -->
  <circle cx="312" cy="52" r="9" fill="rgba(255,255,255,0.15)" stroke="#aaa" stroke-width="1"/>
  <text x="312" y="56" text-anchor="middle" fill="#aaa" font-size="9" font-weight="600">2</text>
  <!-- 位置3：右中 -->
  <circle cx="330" cy="110" r="9" fill="rgba(255,255,255,0.15)" stroke="#aaa" stroke-width="1"/>
  <text x="330" y="114" text-anchor="middle" fill="#aaa" font-size="9" font-weight="600">3</text>
  <!-- 位置4：右下 -->
  <circle cx="312" cy="168" r="9" fill="rgba(255,255,255,0.15)" stroke="#aaa" stroke-width="1"/>
  <text x="312" y="172" text-anchor="middle" fill="#aaa" font-size="9" font-weight="600">4</text>
  <!-- 位置5：底部偏左 -->
  <circle cx="252" cy="200" r="9" fill="rgba(255,255,255,0.15)" stroke="#aaa" stroke-width="1"/>
  <text x="252" y="204" text-anchor="middle" fill="#aaa" font-size="9" font-weight="600">5</text>
  <!-- 位置6：底部偏右 -->
  <circle cx="108" cy="200" r="9" fill="rgba(255,255,255,0.15)" stroke="#aaa" stroke-width="1"/>
  <text x="108" y="204" text-anchor="middle" fill="#aaa" font-size="9" font-weight="600">6</text>
  <!-- 位置7：左下 -->
  <circle cx="48" cy="168" r="9" fill="rgba(255,255,255,0.15)" stroke="#aaa" stroke-width="1"/>
  <text x="48" y="172" text-anchor="middle" fill="#aaa" font-size="9" font-weight="600">7</text>
  <!-- 位置8：左中 -->
  <circle cx="30" cy="110" r="9" fill="rgba(255,255,255,0.15)" stroke="#aaa" stroke-width="1"/>
  <text x="30" y="114" text-anchor="middle" fill="#aaa" font-size="9" font-weight="600">8</text>
  <!-- 位置9：左上 -->
  <circle cx="48" cy="52" r="9" fill="rgba(255,255,255,0.15)" stroke="#aaa" stroke-width="1"/>
  <text x="48" y="56" text-anchor="middle" fill="#aaa" font-size="9" font-weight="600">9</text>
</svg>

<!-- 9个座位：位置标签在上，填名字在下 -->
<div class="seats-wrap" id="seatsWrap">
  <div class="seat-card">
    <div class="pos-badge">1</div>
    <div class="pos-label">庄家位</div>
    <input placeholder="1号位名字" maxlength="10" data-pos="1">
  </div>
  <div class="seat-card">
    <div class="pos-badge">2</div>
    <div class="pos-label">位置 2</div>
    <input placeholder="2号位名字" maxlength="10" data-pos="2">
  </div>
  <div class="seat-card">
    <div class="pos-badge">3</div>
    <div class="pos-label">位置 3</div>
    <input placeholder="3号位名字" maxlength="10" data-pos="3">
  </div>
  <div class="seat-card">
    <div class="pos-badge">4</div>
    <div class="pos-label">位置 4</div>
    <input placeholder="4号位名字" maxlength="10" data-pos="4">
  </div>
  <div class="seat-card">
    <div class="pos-badge">5</div>
    <div class="pos-label">位置 5</div>
    <input placeholder="5号位名字" maxlength="10" data-pos="5">
  </div>
  <div class="seat-card">
    <div class="pos-badge">6</div>
    <div class="pos-label">位置 6</div>
    <input placeholder="6号位名字" maxlength="10" data-pos="6">
  </div>
  <div class="seat-card">
    <div class="pos-badge">7</div>
    <div class="pos-label">位置 7</div>
    <input placeholder="7号位名字" maxlength="10" data-pos="7">
  </div>
  <div class="seat-card">
    <div class="pos-badge">8</div>
    <div class="pos-label">位置 8</div>
    <input placeholder="8号位名字" maxlength="10" data-pos="8">
  </div>
  <div class="seat-card">
    <div class="pos-badge">9</div>
    <div class="pos-label">位置 9</div>
    <input placeholder="9号位名字" maxlength="10" data-pos="9">
  </div>
</div>

<div class="btns">
  <button class="btn btn-primary" onclick="confirmSeats()">✅ 确认报名</button>
  <button class="btn btn-admin" onclick="toggleAdmin()">🔐 管理</button>
  <button class="btn btn-secondary" onclick="loadSeats()">🔄 刷新</button>
</div>

<p class="status" id="status"></p>

<div class="admin-panel" id="adminPanel">
  <h3>🔐 管理员重置</h3>
  <input type="password" id="adminPassword" placeholder="输入管理员密码">
  <button class="btn btn-admin" onclick="resetAll()">🗑️ 清空所有报名</button>
</div>

<div class="info">
  <strong>桌位说明</strong><br>
  庄家位（位置1）= 按钮位，顺时针依次：右→底→左→顶<br>
  德州标准9人桌，庄家位开始顺时针认座
</div>

<script>
const inputs = document.querySelectorAll('input[data-pos]');
const statusEl = document.getElementById('status');
const seatsWrap = document.getElementById('seatsWrap');
const adminPanel = document.getElementById('adminPanel');

const API = '/api/seats';

// 加载报名数据
async function loadSeats() {
  seatsWrap.classList.add('loading');
  try {
    const res = await fetch(API);
    const seats = await res.json();
    inputs.forEach(inp => {
      const pos = inp.dataset.pos;
      const found = seats.find(s => s.pos == pos);
      if (found) {
        inp.value = found.name;
        inp.classList.add('filled');
      } else {
        inp.value = '';
        inp.classList.remove('filled');
      }
    });
  } catch (e) {
    statusEl.textContent = '⚠️ 网络异常，请检查网络';
    statusEl.className = 'status warn';
  }
  seatsWrap.classList.remove('loading');
}

// 报名
async function confirmSeats() {
  const filled = Array.from(inputs)
    .filter(v => v.value.trim())
    .map(v => ({ pos: v.dataset.pos, name: v.value.trim() }));

  if (filled.length === 0) {
    statusEl.textContent = '请至少填写1个名字';
    statusEl.className = 'status warn';
    return;
  }

  seatsWrap.classList.add('loading');
  statusEl.textContent = '提交中...';
  statusEl.className = 'status';

  try {
    // 逐个报名
    for (const seat of filled) {
      await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(seat),
      });
    }
    // 重新加载显示
    await loadSeats();
    const list = filled.map(v => `${v.pos}号位：${v.name}`).join('　|　');
    statusEl.textContent = `✅ 已确认 ${filled.length} 人报名：${list}`;
    statusEl.className = 'status ok';
  } catch (e) {
    statusEl.textContent = '❌ 提交失败，请重试';
    statusEl.className = 'status error';
    seatsWrap.classList.remove('loading');
  }
}

// 重置（管理员）
async function resetAll() {
  const password = document.getElementById('adminPassword').value;
  if (!password) {
    statusEl.textContent = '请输入管理员密码';
    statusEl.className = 'status warn';
    return;
  }
  if (!confirm('确定要清空所有报名吗？此操作不可恢复！')) return;

  try {
    const res = await fetch(API, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    if (res.status === 403) {
      statusEl.textContent = '❌ 管理员密码错误';
      statusEl.className = 'status error';
      return;
    }
    await loadSeats();
    statusEl.textContent = '✅ 已清空所有报名';
    statusEl.className = 'status ok';
    adminPanel.classList.remove('show');
  } catch (e) {
    statusEl.textContent = '❌ 重置失败，请重试';
    statusEl.className = 'status error';
  }
}

// 切换管理面板
function toggleAdmin() {
  adminPanel.classList.toggle('show');
  if (adminPanel.classList.contains('show')) {
    document.getElementById('adminPassword').focus();
  }
}

inputs.forEach(inp => {
  inp.addEventListener('input', () => {
    inp.classList.toggle('filled', !!inp.value.trim());
  });
});

// 启动时加载数据
loadSeats();
</script>

</body>
</html>
